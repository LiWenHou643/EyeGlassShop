spring:
  application:
    name: ${SPRING_APP_NAME:eyeglass}
  config:
    import: application_prod.yaml
  profiles:
    active: default
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:EyeGlassShop}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:Hau643@#}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:TRACE}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:20m}

jwt:
  secret: ${JWT_SECRET:"qwmxUNuHU/QFOb5qVqRj/ePARhnuJJrdfDKa/uqPLfOIxoF0Ryh2NCASNC7JU2q8"}
  expiration: ${JWT_EXPIRATION:3600000}